# 灵译 · 线上部署：app（翻译服务）+ caddy（HTTPS 反向代理，自动申请证书）
services:
  app:
    build: .
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
